# Fetches every source and publishes the JSON to the `data` branch.
# The data branch is a single commit, replaced each run, so the repo
# doesn't grow by megabytes a day and your local main never needs pulling.
name: Fetch data

on:
  schedule:
    # Hourly, off the hour. GitHub's scheduler skips many runs on this repo
    # (2 of 6 three-hourly slots ran on 2026-10-08), so asking every hour keeps
    # data fresh enough. Runs take ~30 s and are free on a public repo.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Restore previous data
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Fetch sources
        run: python -m pipeline.run --out out

      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp spots.json out/spots.json
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Ping dead-man's switch
        if: success() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null

      - name: Alert on failure
        if: failure()
        run: >
          python -m pipeline.ntfy --priority high --tags warning
          --title "Wave Finder fetch failed"
          --message "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
