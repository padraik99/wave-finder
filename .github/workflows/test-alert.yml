# Manual button: Actions → Send test alert → Run workflow.
# Confirms the NTFY_TOPIC secret reaches the phone. Fails (red) if the secret
# is missing or ntfy rejects the message, so a green run means it was sent.
name: Send test alert

on:
  workflow_dispatch:
    inputs:
      message:
        description: Text of the test notification
        default: "Test alert from Wave Finder. If you can read this on your phone, alerts work."
      priority:
        description: ntfy priority (min, low, default, high, urgent)
        type: choice
        options: [default, high, urgent, low, min]
        default: default

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Send
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MESSAGE: ${{ inputs.message }}
          PRIORITY: ${{ inputs.priority }}
        run: >
          python -m pipeline.ntfy --strict --tags ocean,white_check_mark
          --title "Wave Finder test alert"
          --priority "$PRIORITY" --message "$MESSAGE"
